<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acervo DGBooks | Leitor JSON Oficial</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f9f6ef; --surf: #ffffff; --text: #2c2418; --accent: #b87c4f;
            --accent-soft: #e6d5c3; --border: #e2d6ca; --success: #27ae60;
        }
        body.dark {
            --bg: #121212; --surf: #1e1e1e; --text: #ececec; --accent: #e2b87a;
            --accent-soft: #2e2a24; --border: #3a3a3a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; line-height: 1.6; }
        
        header { background: var(--surf); border-bottom: 2px solid var(--accent-soft); padding: 15px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Merriweather', serif; color: var(--accent); font-weight: bold; font-size: 1.4rem; cursor: pointer; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }

        /* Grid Biblioteca */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .card { background: var(--surf); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; position: relative; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card img.cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #eee; }
        .card-content { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        
        .badge-key { position: absolute; top: 10px; right: 10px; background: var(--success); color: white; padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; }
        .card-tag { font-size: 0.7rem; color: var(--accent); font-weight: bold; margin-bottom: 5px; opacity: 0.8; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; font-family: 'Merriweather'; }

        /* Leitor */
        #reader { display: none; animation: fadeIn 0.5s; }
        .book-header { display: flex; gap: 30px; background: var(--surf); padding: 30px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 30px; }
        .book-header img.main-cover { width: 180px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .art-gallery { display: flex; gap: 10px; margin-top: 20px; overflow-x: auto; }
        .art-gallery img { height: 80px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
        .art-gallery img:hover { transform: scale(1.1); }

        .toolbar { background: var(--surf); padding: 15px 25px; border-radius: 50px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; position: sticky; top: 80px; z-index: 90; }
        
        .reading-area { background: var(--surf); padding: 50px; border-radius: 20px; border: 1px solid var(--border); min-height: 60vh; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .act-title { font-family: 'Merriweather', serif; font-size: 1.8rem; color: var(--accent); margin-bottom: 25px; text-align: center; border-bottom: 1px solid var(--accent-soft); padding-bottom: 15px; }
        .act-content { font-size: 1.2rem; white-space: pre-wrap; text-align: justify; }

        .btn { padding: 10px 20px; border-radius: 25px; border: 1px solid var(--accent); background: none; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn:hover { background: var(--accent); color: white; }
        .btn-primary { background: var(--accent); color: white; border: none; }

        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 40px; height: 40px; border: 4px solid #fff3; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 700px) {
            .book-header { flex-direction: column; align-items: center; text-align: center; }
            .toolbar { flex-direction: column; border-radius: 20px; gap: 10px; }
            .reading-area { padding: 25px; }
        }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div><h2 id="loaderMsg">Lendo book.json...</h2></div>

    <header>
        <div class="logo" onclick="location.reload()">📚 DGBooks Acervo</div>
        <button class="btn" onclick="document.body.classList.toggle('dark')">🌓 Tema</button>
    </header>

    <main class="container">
        <!-- BIBLIOTECA -->
        <div id="library">
            <h2 style="margin-bottom: 25px; font-family: 'Merriweather';">Catálogo de Releases</h2>
            <div id="booksGrid" class="grid">
                <p>Buscando livros no GitHub...</p>
            </div>
        </div>

        <!-- LEITOR -->
        <div id="reader">
            <button class="btn" onclick="location.reload()" style="margin-bottom: 20px;">⬅ Voltar ao Catálogo</button>
            
            <div id="bookMeta" class="book-header"></div>

            <div class="toolbar">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn" onclick="navChap(-1)">◀ Cap</button>
                    <span id="infoChap" style="font-weight: bold; min-width: 60px; text-align: center;">Cap 1</span>
                    <button class="btn" onclick="navChap(1)">Cap ▶</button>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn" onclick="navAct(-1)">◀ Ato</button>
                    <span id="infoAct">Ato 1</span>
                    <button class="btn" onclick="navAct(1)">Ato ▶</button>
                </div>
                <button class="btn" onclick="adjFont(2)">A+</button>
            </div>

            <article class="reading-area">
                <h1 id="actTitle" class="act-title"></h1>
                <div id="actContent" class="act-content"></div>
            </article>
        </div>
    </main>

<script>
    const REPO = 'gamesistem/novel-maker';
    let currentBook = null;
    let idxChap = 0;
    let idxAct = 0;
    let fSize = 1.2;

    // Extrai o conteúdo entre os colchetes []
    function parseBrackets(text) {
        if (!text) return [];
        const matches = text.match(/\[(.*?)\]/gs);
        return matches ? matches.map(m => m.replace(/[\[\]]/g, '').trim()) : [];
    }

    async function loadLibrary() {
        const grid = document.getElementById('booksGrid');
        try {
            const releases = await fetch(`https://api.github.com/repos/${REPO}/releases`).then(r => r.json());
            grid.innerHTML = '';

            for (const rel of releases) {
                // Busca o book.json nas assets
                const jsonAsset = rel.assets.find(a => a.name.toLowerCase() === 'book.json');
                if (!jsonAsset) continue;

                // Busca Capa, Key e Artes
                const coverAsset = rel.assets.find(a => a.name.toLowerCase() === 'capa.png');
                const keyAsset = rel.assets.find(a => a.name.includes('keybook.key') || a.name.includes('keybook.keystore'));
                const artes = rel.assets
                    .filter(a => ['arte.png', 'arte1.png', 'arte2.png'].includes(a.name.toLowerCase()))
                    .map(a => a.browser_download_url);

                const meta = parseBrackets(rel.body);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${keyAsset ? `<div class="badge-key">🔐 Licenciado</div>` : ''}
                    <img class="cover" src="${coverAsset ? coverAsset.browser_download_url : 'https://via.placeholder.com/250x375?text=Sem+Capa'}" alt="Capa">
                    <div class="card-content">
                        <div class="card-tag">${rel.tag_name}</div>
                        <div class="card-title">${meta[0] || rel.name}</div>
                        <div style="font-size:0.75rem; color:var(--accent); font-weight:bold;">${meta[1] || 'Gênero'}</div>
                        <button class="btn btn-primary" style="margin-top:auto; width:100%;">Ler Livro</button>
                    </div>
                `;
                
                card.onclick = () => readBookJSON(jsonAsset.browser_download_url, rel, artes, !!keyAsset);
                grid.appendChild(card);
            }
        } catch (e) {
            grid.innerHTML = '<p>Erro ao carregar catálogo do GitHub.</p>';
        }
    }

    // Função que "Lê" o JSON direto para a memória sem baixar arquivo físico
    async function readBookJSON(url, release, artes, hasKey) {
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        
        try {
            // Usando proxy para evitar erro de CORS do navegador ao ler assets de releases
            const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxy);
            const data = await response.json();

            currentBook = data;
            const meta = parseBrackets(release.body);

            // Injeta metadados da release no objeto em memória
            currentBook._ext = {
                desc: meta[8] || "Sem descrição disponível.",
                tag: release.tag_name,
                authorReal: meta[6] || "Desconhecido",
                artes: artes,
                hasKey: hasKey,
                cover: release.assets.find(a => a.name.toLowerCase() === 'capa.png')?.browser_download_url
            };

            idxChap = 0; idxAct = 0;
            renderReader();
            
            document.getElementById('library').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            window.scrollTo(0,0);
        } catch (e) {
            alert("Erro ao ler o arquivo book.json: " + e.message);
        } finally {
            loader.style.display = 'none';
        }
    }

    function renderReader() {
        const metaDiv = document.getElementById('bookMeta');
        const ex = currentBook._ext;
        
        metaDiv.innerHTML = `
            <img class="main-cover" src="${ex.cover || ''}">
            <div style="flex:1">
                <h1 style="font-family:Merriweather; color:var(--accent); margin-bottom:5px;">${currentBook.title}</h1>
                <p style="font-size:0.85rem;"><strong>TAG ID:</strong> ${ex.tag}</p>
                <p style="font-size:0.85rem;"><strong>Autor Real:</strong> ${ex.authorReal}</p>
                ${ex.hasKey ? `<p style="color:var(--success); font-weight:bold; font-size:0.85rem;">🔐 Livro Licenciado (Key detectada)</p>` : ''}
                <div style="margin-top:10px; font-size:0.9rem; font-style:italic; border-top:1px solid var(--border); padding-top:10px;">${ex.desc}</div>
                <div class="art-gallery">
                    ${ex.artes.map(url => `<img src="${url}" onclick="window.open('${url}')">`).join('')}
                </div>
            </div>
        `;
        updatePage();
    }

    function updatePage() {
        const chap = currentBook.chapters[idxChap];
        const act = chap.acts[idxAct];

        document.getElementById('infoChap').innerText = `Cap ${idxChap + 1}`;
        document.getElementById('infoAct').innerText = `Ato ${idxAct + 1} / ${chap.acts.length}`;
        document.getElementById('actTitle').innerText = act.title || `Ato ${idxAct + 1}`;
        document.getElementById('actContent').innerText = act.content || "Sem conteúdo.";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navChap(d) {
        let n = idxChap + d;
        if (n >= 0 && n < currentBook.chapters.length) {
            idxChap = n; idxAct = 0; updatePage();
        }
    }

    function navAct(d) {
        let acts = currentBook.chapters[idxChap].acts;
        let n = idxAct + d;
        if (n >= 0 && n < acts.length) {
            idxAct = n; updatePage();
        } else if (d > 0 && (idxChap + 1) < currentBook.chapters.length) {
            navChap(1);
        } else if (d < 0 && idxChap > 0) {
            idxChap--;
            idxAct = currentBook.chapters[idxChap].acts.length - 1;
            updatePage();
        }
    }

    function adjFont(n) {
        fSize += n/20;
        document.getElementById('actContent').style.fontSize = fSize + "rem";
    }

    window.onload = loadLibrary;
</script>
</body>
</html>
