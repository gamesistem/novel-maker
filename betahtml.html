<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Acervo DGBooks & Leitor</title>
    <!-- JSZip para ler os arquivos .dgbooks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* ---------- VARIÁVEIS E BASE ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-page: #f9f6ef;
            --surface: #ffffff;
            --text-primary: #2c2418;
            --text-secondary: #5a4a3a;
            --accent: #b87c4f;
            --accent-soft: #e6d5c3;
            --border-light: #e2d6ca;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --header-bg: #fffbf5;
        }

        body.dark {
            --bg-page: #121212;
            --surface: #1e1e1e;
            --text-primary: #ececec;
            --text-secondary: #b0b0b0;
            --accent: #e2b87a;
            --accent-soft: #2e2a24;
            --border-light: #3a3a3a;
            --header-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: background 0.2s, color 0.2s;
            line-height: 1.5;
        }

        .app-container { max-width: 1000px; margin: 0 auto; padding: 0 20px 40px; }

        .header-main {
            background: var(--header-bg);
            border-bottom: 2px solid var(--accent-soft);
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 0 0 24px 24px;
            box-shadow: var(--shadow-sm);
        }

        .header-inner {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            gap: 15px; padding: 0 20px; max-width: 1000px; margin: 0 auto;
        }

        .logo h1 { font-family: 'Merriweather', serif; font-size: 1.7rem; color: var(--accent); cursor: pointer; }

        .btn {
            background: transparent; border: 1px solid var(--accent); padding: 8px 18px;
            border-radius: 60px; font-weight: 500; cursor: pointer; color: var(--accent);
            font-size: 0.85rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }

        .btn-primary { background: var(--accent); color: #1e1a14; border: none; }
        .btn-primary:hover { background: #a05e32; color: white; }
        .btn-outline:hover { background: var(--accent-soft); color: var(--text-primary); }

        /* ---------- BIBLIOTECA ---------- */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; margin-top: 20px; }

        .book-card {
            background: var(--surface); border: 1px solid var(--border-light);
            border-radius: 16px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer; display: flex; flex-direction: column;
        }

        .book-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-sm); border-color: var(--accent); }

        .book-cover-container {
            width: 100%; aspect-ratio: 2 / 3; background: var(--accent-soft);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .book-cover-container img { width: 100%; height: 100%; object-fit: cover; }
        .book-info { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .book-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; color: var(--text-primary); }
        .book-genre { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }

        .loading-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .spinner {
            border: 4px solid var(--accent-soft); border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ---------- LEITOR ---------- */
        #readerView { display: none; }
        .metadata-panel { background: var(--surface); border-radius: 28px; padding: 24px; margin-bottom: 32px; display: flex; flex-wrap: wrap; gap: 28px; border: 1px solid var(--border-light); }
        .cover-box img { max-width: 130px; border-radius: 16px; border: 2px solid var(--accent); }
        .book-description { font-size: 0.9rem; color: var(--text-secondary); padding: 10px; background: var(--bg-page); border-radius: 8px; white-space: pre-wrap; margin-top: 10px; }
        
        .reader-toolbar {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 12px 20px; border-radius: 60px; margin-bottom: 28px; gap: 12px; border: 1px solid var(--border-light);
        }

        .act-page { background: var(--surface); border-radius: 32px; padding: 40px 36px; border: 1px solid var(--border-light); min-height: 60vh; }
        .act-title-page { font-family: 'Merriweather', serif; font-size: 1.8rem; color: var(--accent); margin-bottom: 20px; border-left: 5px solid var(--accent); padding-left: 15px; }
        .act-content-page { font-size: 1.1rem; line-height: 1.8; white-space: pre-wrap; }

        #globalLoader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }

        @media (max-width: 760px) {
            .reader-toolbar { border-radius: 20px; flex-direction: column; }
            .nav-controls { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="header-main">
        <div class="header-inner">
            <div class="logo" onclick="location.reload()">
                <h1>📚 Novel Maker</h1>
                <p style="color: var(--text-secondary); font-size: 0.8rem;">Acervo e Leitor Oficial</p>
            </div>
            <div class="action-buttons" id="readerActions" style="display: none;">
                <button class="btn btn-outline" onclick="showLibrary()">⬅️ Biblioteca</button>
            </div>
            <div class="action-buttons" id="libraryActions">
                <button class="btn btn-outline" onclick="toggleTheme()">🌓 Tema</button>
            </div>
        </div>
    </div>

    <div id="globalLoader">
        <div class="spinner"></div>
        <h2>Processando livro...</h2>
        <p>Isso resolve problemas de conexão (CORS).</p>
    </div>

    <div class="app-container">
        <div id="libraryView">
            <h2 style="margin-bottom: 20px;">Explore o Acervo</h2>
            <div id="libraryLoading" class="loading-state">
                <div class="spinner"></div>
                <p>Buscando livros no GitHub...</p>
            </div>
            <div id="booksGrid" class="books-grid" style="display: none;"></div>
        </div>

        <div id="readerView">
            <div id="metadataPanel" class="metadata-panel"></div>

            <div class="reader-toolbar">
                <div class="nav-controls" style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn" onclick="changeChapter(-1)">◀ Cap</button>
                    <span id="chapInfo" style="font-weight: bold;">Cap 1</span>
                    <button class="btn" onclick="changeChapter(1)">Cap ▶</button>
                    <button class="btn" onclick="changeAct(-1)">◀ Ato</button>
                    <span id="actInfo">Ato 1</span>
                    <button class="btn" onclick="changeAct(1)">Ato ▶</button>
                </div>
                <div class="font-controls">
                    <button class="btn" onclick="changeFontSize(-10)">A-</button>
                    <button class="btn" onclick="changeFontSize(10)">A+</button>
                </div>
            </div>

            <div class="act-page">
                <div id="actTitle" class="act-title-page"></div>
                <div id="actContent" class="act-content-page"></div>
            </div>
        </div>
    </div>

<script>
    const GITHUB_REPO = 'gamesistem/novel-maker';
    let currentBook = null;
    let curChap = 0;
    let curAct = 0;
    let fontSize = 100;

    // --- CORREÇÃO DO ERRO FAILED TO FETCH (CORS PROXY) ---
    // Usamos o allorigins para permitir o download de arquivos do GitHub
    async function fetchWithCORS(url) {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Erro ao acessar servidor via Proxy.");
        return response;
    }

    async function fetchLibrary() {
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases`);
            const releases = await res.json();
            const books = [];

            for (const rel of releases) {
                const dgAsset = rel.assets.find(a => a.name.endsWith('.dgbooks'));
                if (!dgAsset) continue;

                const coverAsset = rel.assets.find(a => /capa/i.test(a.name));
                
                // Parse simplificado dos colchetes na descrição [Título][Gênero]...
                const matches = rel.body ? rel.body.match(/\[(.*?)\]/g) : [];
                const meta = matches ? matches.map(m => m.replace(/[\[\]]/g, '')) : [];

                books.push({
                    title: meta[0] || rel.name,
                    genre: meta[1] || 'Geral',
                    author: meta[5] || 'Desconhecido',
                    desc: meta[8] || rel.body,
                    coverUrl: coverAsset ? coverAsset.browser_download_url : null,
                    bookUrl: dgAsset.browser_download_url,
                    tag: rel.tag_name
                });
            }
            renderGrid(books);
        } catch (e) {
            document.getElementById('libraryLoading').innerHTML = "Erro ao carregar biblioteca.";
        }
    }

    function renderGrid(books) {
        const grid = document.getElementById('booksGrid');
        document.getElementById('libraryLoading').style.display = 'none';
        grid.style.display = 'grid';
        grid.innerHTML = '';

        books.forEach(b => {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.innerHTML = `
                <div class="book-cover-container">
                    ${b.coverUrl ? `<img src="${b.coverUrl}">` : '📘'}
                </div>
                <div class="book-info">
                    <span class="book-genre">${b.genre}</span>
                    <h3 class="book-title">${b.title}</h3>
                    <button class="btn btn-primary" style="margin-top:auto">Ler Agora</button>
                </div>
            `;
            card.onclick = () => downloadBook(b);
            grid.appendChild(card);
        });
    }

    async function downloadBook(bookMeta) {
        try {
            document.getElementById('globalLoader').style.display = 'flex';
            
            // Aqui é onde o erro acontecia. Agora usamos o Proxy.
            const response = await fetchWithCORS(bookMeta.bookUrl);
            const blob = await response.blob();
            
            const zip = await JSZip.loadAsync(blob);
            const jsonFile = zip.file("data/book.json");
            const data = JSON.parse(await jsonFile.async("string"));

            currentBook = data;
            // Mesclar dados da release se faltarem no JSON
            currentBook.description = currentBook.description || bookMeta.desc;
            currentBook.coverUrl = bookMeta.coverUrl;
            
            curChap = 0; curAct = 0;
            renderReader();
            showReader();
        } catch (e) {
            alert("Erro ao baixar: " + e.message);
        } finally {
            document.getElementById('globalLoader').style.display = 'none';
        }
    }

    function renderReader() {
        const meta = document.getElementById('metadataPanel');
        meta.innerHTML = `
            <div class="cover-box"><img src="${currentBook.coverUrl || ''}"></div>
            <div class="info-box">
                <h2>${currentBook.title}</h2>
                <p><strong>Autor:</strong> ${currentBook.author}</p>
                <div class="book-description">${currentBook.description || ''}</div>
            </div>
        `;
        updateContent();
    }

    function updateContent() {
        const chap = currentBook.chapters[curChap];
        const act = chap.acts[curAct];
        
        document.getElementById('chapInfo').innerText = `Cap ${curChap + 1}`;
        document.getElementById('actInfo').innerText = `Ato ${curAct + 1} / ${chap.acts.length}`;
        document.getElementById('actTitle').innerText = act.title || `Ato ${curAct + 1}`;
        document.getElementById('actContent').innerText = act.content;
        window.scrollTo(0,0);
    }

    function changeChapter(n) {
        let next = curChap + n;
        if (next >= 0 && next < currentBook.chapters.length) {
            curChap = next; curAct = 0; updateContent();
        }
    }

    function changeAct(n) {
        let acts = currentBook.chapters[curChap].acts;
        let next = curAct + n;
        if (next >= 0 && next < acts.length) {
            curAct = next; updateContent();
        } else if (n > 0) { changeChapter(1); }
        else { changeChapter(-1); }
    }

    function changeFontSize(n) {
        fontSize += n;
        document.getElementById('actContent').style.fontSize = fontSize + "%";
    }

    function showReader() {
        document.getElementById('libraryView').style.display = 'none';
        document.getElementById('libraryActions').style.display = 'none';
        document.getElementById('readerView').style.display = 'block';
        document.getElementById('readerActions').style.display = 'block';
    }

    function showLibrary() { location.reload(); }

    function toggleTheme() { document.body.classList.toggle('dark'); }

    window.onload = fetchLibrary;
</script>
</body>
</html>
