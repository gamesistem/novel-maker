<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGBooks | Leitor de Acervo JSON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f1ea; --surf: #ffffff; --text: #2c2418; --accent: #8b5a2b; --border: #dcd7ca;
        }
        body.dark {
            --bg: #1a1a1a; --surf: #242424; --text: #e0e0e0; --accent: #d4a373; --border: #333333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: background 0.3s; }

        /* --- Header --- */
        header { background: var(--surf); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .logo { font-weight: bold; color: var(--accent); cursor: pointer; font-size: 1.2rem; }

        /* --- Biblioteca --- */
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
        .book-card { background: var(--surf); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: 0.3s; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .book-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .book-card-body { padding: 1rem; }
        .book-title { font-weight: 600; font-size: 1rem; margin-bottom: 0.3rem; }
        .book-author { font-size: 0.8rem; color: var(--accent); }

        /* --- Leitor Imersivo --- */
        #reader-view { display: none; background: var(--bg); min-height: 100vh; padding-bottom: 5rem; }
        .reader-container { max-width: 750px; margin: 0 auto; padding: 2rem 1.5rem; }
        
        .book-meta-header { display: flex; gap: 2rem; margin-bottom: 3rem; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 2rem; }
        .book-meta-header img { width: 150px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .chapter-title { font-family: 'Lora', serif; font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent); }
        .act-title { font-family: 'Lora', serif; font-size: 1.5rem; margin-bottom: 2rem; opacity: 0.8; font-style: italic; }
        .reading-text { font-family: 'Lora', serif; font-size: 1.25rem; line-height: 1.8; white-space: pre-wrap; text-align: justify; }

        /* --- Controles Flutuantes --- */
        .controls { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--surf); padding: 0.8rem 1.5rem; border-radius: 50px; border: 1px solid var(--border); display: flex; gap: 1.5rem; align-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 100; }
        .btn { border: none; background: none; color: var(--text); cursor: pointer; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
        .btn:hover { color: var(--accent); }
        .progress-info { font-size: 0.8rem; border-left: 1px solid var(--border); padding-left: 1.5rem; opacity: 0.7; }

        #loader { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .book-meta-header { flex-direction: column; text-align: center; }
            .controls { width: 90%; justify-content: space-between; gap: 5px; font-size: 0.7rem; }
            .chapter-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div><br><p>Lendo dados do livro...</p></div>

    <header>
        <div class="logo" onclick="location.reload()">📚 DGBooks Acervo</div>
        <button class="btn" onclick="document.body.classList.toggle('dark')">🌓 Modo</button>
    </header>

    <!-- BIBLIOTECA -->
    <main id="library-view" class="container">
        <h2 style="margin-bottom: 2rem; font-family: 'Lora', serif;">Disponíveis para Leitura</h2>
        <div id="booksGrid" class="grid">
            <p>Carregando catálogo...</p>
        </div>
    </main>

    <!-- LEITOR -->
    <main id="reader-view">
        <div class="reader-container">
            <div id="bookMeta" class="book-meta-header">
                <!-- Preenchido via JS -->
            </div>

            <article>
                <h1 id="displayChapter" class="chapter-title">Título do Capítulo</h1>
                <h2 id="displayAct" class="act-title">Título do Ato</h2>
                <div id="displayText" class="reading-text"></div>
            </article>
        </div>

        <nav class="controls">
            <button class="btn" onclick="navigate(-1)">◀ Ant.</button>
            <button class="btn" onclick="navigate(1)">Próx. ▶</button>
            <div class="progress-info">
                <span id="progChap">Cap. 1</span> • <span id="progAct">Ato 1</span>
